spring:
  application:
    name: api-gateway

server:
  port: 8080

# Route table — prefix → backend base URL
# The routing filter matches request path prefixes and forwards to the right service
gateway:
  routes:
    "[/auth]": http://localhost:8081
    "[/products]": http://localhost:8082
    "[/cart]": http://localhost:8083
    "[/orders]": http://localhost:8084
    "[/payments]": http://localhost:8085
    "[/notifications]": http://localhost:8087

# Shared JWT secret — same value across auth-service, product-service, api-gateway
jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437

# Per-route rate limits (requests per minute per client IP)
# /auth/login is strict — brute-force protection
# /auth/register is moderate — prevent account farming
# /products is loose — normal API traffic
# anything else uses default-requests-per-minute
rate-limit:
  routes:
    "[/auth/login]": 5
    "[/auth/register]": 10
    "[/products]": 100
  default-requests-per-minute: 60

logging:
  level:
    com.fooddelivery.apigateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      service: ${spring.application.name}